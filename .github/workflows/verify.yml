name: Verify local workflows
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix skills/rageclick ci
      - run: npm --prefix skills/rageclick exec -- playwright install chromium
      - run: npm test
      - run: npm run verify:demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-evidence
          path: output/playwright/
          if-no-files-found: ignore

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">RageClick — replay the unhappy path</title>
  <desc id="description">A cream and charcoal wordmark with three orange cursor marks. Click, retry, return. One goal, five ways off the happy path.</desc>
  <rect width="1280" height="360" rx="20" fill="#20211d"/>
  <path d="M48 290H1232" stroke="#53564a"/>
  <text x="58" y="66" fill="#ed794e" font-family="Consolas,monospace" font-size="15" letter-spacing="3">LOCAL WEB WORKFLOWS / REPLAYABLE EVIDENCE</text>
  <text x="52" y="189" fill="#f2f0e7" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="700" letter-spacing="-6">RageClick</text>
  <text x="58" y="245" fill="#c7c9ba" font-family="Arial,Helvetica,sans-serif" font-size="25">One goal. Five ways off the happy path.</text>
  <text x="58" y="328" fill="#c7c9ba" font-family="Consolas,monospace" font-size="14" letter-spacing="2">CLICK · RETRY · RETURN</text>
  <text x="914" y="328" fill="#ed794e" font-family="Consolas,monospace" font-size="14" letter-spacing="2">OBSERVE → REPLAY → VERIFY</text>
  <g stroke="#ed794e" stroke-width="5" stroke-linejoin="round" fill="none">
    <path d="m927 116 80 63-45 4-20 43z" opacity=".22"/>
    <path d="m991 96 80 63-45 4-20 43z" opacity=".55"/>
    <path d="m1055 76 80 63-45 4-20 43z" fill="#ed794e"/>
    <path d="m1126 73 16-19m10 64 26-2m-74-65 3-25"/>
  </g>
</svg>
